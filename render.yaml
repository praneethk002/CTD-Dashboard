services:
  - type: web
    name: ctd-dashboard
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m gunicorn api.app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: FRED_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
